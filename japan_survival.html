<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14396d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>일본 여행 생존 앱</title>
<style>
:root{
  --accent:#14396d; --accent-deep:#0d2649; --signal:#ffc400;
  --bg:#e8eaee; --panel:#fff; --ink:#101720; --sub:#5b6572; --line:#d3d8df;
  --chipbg:#fff; --fs:1;
}
html[data-theme="dark"]{
  --bg:#0c1016; --panel:#161d26; --ink:#eef2f7; --sub:#93a0af; --line:#27313d; --chipbg:#161d26;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:calc(16px * var(--fs));
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
.loc{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Microsoft YaHei","PingFang SC","Noto Sans JP","Noto Sans SC",-apple-system,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ── header: 표지판 상단 띠 */
header{position:sticky;top:0;z-index:30;background:var(--accent);color:#fff;padding:env(safe-area-inset-top) 0 0}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px 12px;max-width:820px;margin:0 auto}
.hmark{width:6px;height:30px;background:var(--signal);flex:none}
.htitle{font-size:1.06rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;flex:1;min-width:0}
.htitle small{display:block;font-size:.68rem;font-weight:500;opacity:.78;margin-top:2px;letter-spacing:0}
.hbtn{width:42px;height:42px;border-radius:3px;background:rgba(255,255,255,.14);color:#fff;font-size:1.15rem;display:grid;place-items:center;flex:none}
.hbtn:active{background:rgba(255,255,255,.3)}

.wrap{max-width:820px;margin:0 auto;padding:0 14px}

/* ── search + chips */
.searchbar{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:20;background:var(--bg);padding:12px 0 6px}
.searchbar input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 14px;outline:none}
.searchbar input:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--chipbg);color:var(--sub);padding:9px 13px;border-radius:2px;font-size:.85rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── phrase card: 좌측 방향바 = 표지판 */
.list{display:grid;gap:8px;padding-bottom:20px}
.pc{display:grid;grid-template-columns:5px 1fr auto;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;align-items:stretch}
.pc>.bar{background:var(--accent)}
.pc.fav>.bar{background:var(--signal)}
.pc>.body{padding:13px 4px 13px 13px;text-align:left;min-width:0}
.pc .kr{display:block;font-size:.83rem;font-weight:600;color:var(--sub);line-height:1.4}
.pc .local{display:block;font-size:1.19rem;font-weight:700;line-height:1.42;margin-top:5px;letter-spacing:-.01em;word-break:break-word}
.pc .rom{display:block;font-size:.75rem;color:var(--sub);margin-top:5px;line-height:1.4}
.side{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 8px}
.side button{width:44px;height:40px;border-radius:3px;font-size:1.05rem;display:grid;place-items:center;color:var(--sub)}
.side button:active{background:var(--bg)}
.side .on{color:var(--signal)}
html[data-theme="dark"] .side .on{color:var(--signal)}

.empty{text-align:center;color:var(--sub);padding:56px 20px;line-height:1.6;font-size:.9rem}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:6px}

/* ── section heads */
.sect{margin:18px 0 9px;display:flex;align-items:center;gap:9px}
.sect i{width:5px;height:17px;background:var(--accent);font-style:normal;flex:none}
.sect h2{margin:0;font-size:.92rem;font-weight:800;letter-spacing:-.01em}
.note{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--signal);border-radius:3px;padding:12px 13px;font-size:.83rem;color:var(--sub);line-height:1.6;margin:12px 0}
.note b{color:var(--ink);display:block;margin-bottom:3px;font-size:.88rem}

/* ── scene */
.scene{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:8px;overflow:hidden}
.scene>summary{list-style:none;padding:15px 14px;display:flex;align-items:center;gap:11px;font-weight:700;font-size:.98rem;cursor:pointer}
.scene>summary::-webkit-details-marker{display:none}
.scene>summary .em{font-size:1.25rem}
.scene>summary .cnt{margin-left:auto;font-size:.75rem;color:var(--sub);font-weight:600}
.scene[open]>summary{background:var(--accent);color:#fff}
.scene[open]>summary .cnt{color:rgba(255,255,255,.8)}
.scene .steps{padding:8px;display:grid;gap:8px}
.step{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start;text-align:left;width:100%;padding:9px 6px;border-radius:3px}
.step:active{background:var(--bg)}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:.75rem;font-weight:800;display:grid;place-items:center;margin-top:2px}
.step .local{font-size:1.02rem;font-weight:700;line-height:1.4}
.step .kr{font-size:.76rem;color:var(--sub);margin-top:3px}

/* ── show tab */
.big-input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:15px;font-size:1.15rem;font-weight:700;outline:none;resize:none;min-height:72px}
.big-input:focus{border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.pad button{background:var(--panel);border:1px solid var(--line);border-radius:3px;height:54px;font-size:1.2rem;font-weight:700}
.pad button:active{background:var(--accent);color:#fff}
.wide{width:100%;background:var(--accent);color:#fff;border-radius:3px;padding:16px;font-weight:800;font-size:1rem;margin-top:9px}
.wide:active{background:var(--accent-deep)}
.wide.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}

.q{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:9px;overflow:hidden}
.q .qhead{background:var(--accent-deep);color:#fff;padding:14px}
.q .ql{font-size:1.24rem;font-weight:800;line-height:1.35}
.q .qk{font-size:.76rem;opacity:.8;margin-top:4px}
.q .opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px}
.q .opts button{background:var(--bg);border:1px solid var(--line);border-radius:3px;min-height:58px;padding:10px 8px;font-size:1.05rem;font-weight:700;line-height:1.3}
.q .opts button:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.q .ans{display:none;padding:14px;border-top:2px solid var(--signal);background:var(--bg)}
.q .ans.on{display:block}
.q .ans b{display:block;font-size:1.5rem;font-weight:800}
.q .ans span{font-size:.8rem;color:var(--sub)}

/* ── SOS */
.sos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tel{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-left:5px solid #d92b2b;border-radius:3px;padding:14px}
.tel .num{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.tel .lb{font-size:.83rem;font-weight:700;margin-top:2px}
.tel .ds{font-size:.72rem;color:var(--sub);margin-top:3px}
.sosbtn{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid #d92b2b;border-radius:3px;padding:14px;margin-bottom:8px}
.sosbtn .local{display:block;white-space:pre-wrap;font-size:1.1rem;font-weight:800;line-height:1.4}
.sosbtn .kr{display:block;font-size:.78rem;color:var(--sub);margin-top:4px}

/* ── nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.navin button{padding:9px 2px 10px;font-size:.66rem;font-weight:700;color:var(--sub);display:grid;gap:3px;justify-items:center;border-top:3px solid transparent;margin-top:-1px}
.navin button .ic{font-size:1.12rem;line-height:1}
.navin button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
html[data-theme="dark"] .navin button[aria-selected="true"]{color:var(--signal);border-top-color:var(--signal)}

/* ── signboard (풀스크린) */
#board{position:fixed;inset:0;z-index:100;background:var(--accent);color:#fff;display:none;flex-direction:column}
#board.on{display:flex}
#board.sos{background:#b81f1f}
#board .bt{display:flex;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;gap:6px}
#board .bt button{width:46px;height:46px;border-radius:3px;background:rgba(255,255,255,.16);color:#fff;font-size:1.1rem;display:grid;place-items:center}
#board .bt .sp{flex:1}
#board .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 22px;text-align:center;overflow:auto}
#bLocal{font-size:clamp(30px,8.4vw,74px);font-weight:800;line-height:1.28;letter-spacing:-.02em;word-break:break-word}
#bKr{font-size:clamp(13px,3.4vw,19px);opacity:.82;margin-top:20px;line-height:1.5}
#bRom{font-size:clamp(11px,3vw,15px);opacity:.6;margin-top:8px}
#board .rep{padding:10px 12px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:7px}
#board .rep button{background:#fff;color:#111;border-radius:3px;min-height:60px;font-size:1.05rem;font-weight:800;padding:8px}
#board .rep button:active{background:var(--signal)}
#bReply{display:none;background:#fff;color:#111;border-radius:3px;padding:16px;margin:0 12px 10px;text-align:center}
#bReply.on{display:block}
#bReply b{display:block;font-size:1.7rem;font-weight:800;line-height:1.25}
#bReply span{font-size:.8rem;color:#666;display:block;margin-top:5px}

/* ── settings sheet */
#sheet{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
#sheet.on{display:flex}
.sheetin{background:var(--panel);width:100%;max-width:820px;margin:0 auto;border-radius:12px 12px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.srow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.srow .lbl{flex:1;font-size:.9rem;font-weight:700}
.srow .lbl small{display:block;font-weight:500;color:var(--sub);font-size:.73rem;margin-top:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex:none}
.seg button{padding:9px 11px;font-size:.78rem;font-weight:700;color:var(--sub);min-width:46px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

@media(min-width:640px){
  .list{grid-template-columns:1fr 1fr}
  .q .opts{grid-template-columns:repeat(3,1fr)}
  #board .rep{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:no-preference){
  .pc,.scene>summary{transition:background .12s}
}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
</style></head><body>

<header>
  <div class="hrow">
    <span class="hmark"></span>
    <div class="htitle">일본 여행 생존 앱<small>일본어 ↔ 한국어 · 인터넷 없이 동작</small></div>
    <button class="hbtn" onclick="openSheet()" aria-label="설정">⚙</button>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav><div class="navin" id="nav"></div></nav>

<div id="board" onclick="if(event.target.id==='board')closeBoard()">
  <div class="bt">
    <button onclick="closeBoard()" aria-label="닫기">✕</button>
    <span class="sp"></span>
    <button onclick="boardStep(-1)" aria-label="이전">‹</button>
    <button onclick="boardStep(1)" aria-label="다음">›</button>
    <button onclick="speak(BST.local)" aria-label="읽어주기">🔊</button>
  </div>
  <div class="mid">
    <div id="bLocal" class="loc"></div>
    <div id="bKr"></div>
    <div id="bRom"></div>
  </div>
  <div id="bReply"><b></b><span></span></div>
  <div class="rep" id="bRep"></div>
</div>

<div id="sheet" onclick="if(event.target.id==='sheet')closeSheet()">
  <div class="sheetin">
    <div class="srow"><div class="lbl">화면<small>어두운 곳에서는 다크가 눈이 편해요</small></div>
      <div class="seg" id="segTheme"></div></div>
    <div class="srow"><div class="lbl">글자 크기<small>장갑 끼고도 읽히게</small></div>
      <div class="seg" id="segSize"></div></div>
    <div class="srow"><div class="lbl">발음 표기<small>한글 발음 줄</small></div>
      <div class="seg" id="segRom"></div></div>
    <div class="srow"><div class="lbl">읽어주는 속도<small>상대가 알아듣기 좋은 속도</small></div>
      <div class="seg" id="segRate"></div></div>
    <div class="note" style="margin-top:14px">
      <b>개인정보를 저장하지 않습니다</b>
      즐겨찾기·최근 사용·화면 설정만 이 기기의 브라우저에 저장됩니다.
    </div>
    <button class="wide ghost" onclick="closeSheet()">닫기</button>
  </div>
</div>

/* ── state */
const store={
  get(k,d){try{const v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
};
let favs=new Set(store.get('favs',[]));
let recent=store.get('recent',[]);
let cfg=Object.assign({theme:'auto',size:'m',rom:true,rate:0.85},store.get('cfg',{}));
let tab='phrases', cat='전체', query='';

/* ── settings */
function applyCfg(){
  const t=cfg.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):cfg.theme;
  document.documentElement.dataset.theme=t;
  document.documentElement.style.setProperty('--fs',{s:.92,m:1,l:1.14,xl:1.3}[cfg.size]||1);
  store.set('cfg',cfg);
}
function seg(el,opts,cur,fn){
  el.innerHTML=opts.map(o=>`<button aria-pressed="${o[0]===cur}" data-v="${o[0]}">${o[1]}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{fn(b.dataset.v);buildSheet()});
}
function buildSheet(){
  seg($('segTheme'),[['auto','자동'],['light','밝게'],['dark','어둡게']],cfg.theme,v=>{cfg.theme=v;applyCfg()});
  seg($('segSize'),[['m','보통'],['l','크게'],['xl','아주 크게']],cfg.size,v=>{cfg.size=v;applyCfg()});
  seg($('segRom'),[[true,'표시'],[false,'숨김']],cfg.rom,v=>{cfg.rom=(v==='true');applyCfg();render()});
  seg($('segRate'),[[0.7,'느리게'],[0.85,'보통'],[1,'빠르게']],cfg.rate,v=>{cfg.rate=parseFloat(v);applyCfg()});
}
function openSheet(){buildSheet();$('sheet').classList.add('on')}
function closeSheet(){$('sheet').classList.remove('on')}

/* ── speech */
function speak(t){
  if(!t)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANG;u.rate=cfg.rate;speechSynthesis.speak(u)}
  catch(e){}
}

/* ── signboard */
let BST={local:'',kr:'',rom:'',list:[],i:-1,replies:[]};
function openBoard(local,kr,rom,list,i,isSos,replies){
  BST={local,kr,rom:rom||'',list:list||[],i:i===undefined?-1:i,replies:replies||[]};
  $('bLocal').textContent=local;
  $('bKr').textContent=kr||'';
  $('bRom').textContent=(cfg.rom&&rom)?rom:'';
  $('bReply').classList.remove('on');
  $('board').classList.toggle('sos',!!isSos);
  $('bRep').innerHTML=BST.replies.map((r,j)=>`<button onclick="reply(${j})">${esc(r.local)}</button>`).join('');
  $('bRep').style.display=BST.replies.length?'grid':'none';
  $('board').classList.add('on');
  document.body.style.overflow='hidden';
}
function openPhrase(id,list){
  const p=byId[id];if(!p)return;
  recent=[id,...recent.filter(x=>x!==id)].slice(0,12);store.set('recent',recent);
  const L=list&&list.length?list:[id];
  openBoard(p.local,p.kr,p.roman,L,L.indexOf(id),false,contextualReplies(p));
}
function boardStep(d){
  if(BST.i<0||BST.list.length<2)return;
  const n=(BST.i+d+BST.list.length)%BST.list.length;
  openPhrase(BST.list[n],BST.list);
}
function reply(j){
  const r=BST.replies[j],el=$('bReply');if(!r)return;
  el.querySelector('b').textContent=r.kr;
  el.querySelector('span').textContent=r.local;
  el.classList.add('on');
}
function closeBoard(){$('board').classList.remove('on');document.body.style.overflow=''}
addEventListener('keydown',e=>{
  if(!$('board').classList.contains('on'))return;
  if(e.key==='Escape')closeBoard();
  if(e.key==='ArrowRight')boardStep(1);
  if(e.key==='ArrowLeft')boardStep(-1);
});

/* ── favorites */
function toggleFav(e,id){e.stopPropagation();favs.has(id)?favs.delete(id):favs.add(id);store.set('favs',[...favs]);render()}

/* ── rendering pieces */
function cardHTML(p,listJson){
  return `<div class="pc${favs.has(p.id)?' fav':''}">
    <span class="bar"></span>
    <button class="body" onclick='openPhrase("${p.id}",${listJson})'>
      <span class="kr">${esc(p.kr)}</span>
      <span class="local loc">${esc(p.local)}</span>
      ${cfg.rom&&p.roman?`<span class="rom">${esc(p.roman)}</span>`:''}
    </button>
    <div class="side">
      <button onclick='event.stopPropagation();speak(${JSON.stringify(p.local)})' aria-label="읽어주기">🔊</button>
      <button class="${favs.has(p.id)?'on':''}" onclick="toggleFav(event,'${p.id}')" aria-label="즐겨찾기">${favs.has(p.id)?'★':'☆'}</button>
    </div>
  </div>`;
}
function listHTML(items){
  if(!items.length)return '';
  const ids=JSON.stringify(items.map(p=>p.id)).replace(/"/g,'&quot;');
  return `<div class="list">${items.map(p=>cardHTML(p,ids)).join('')}</div>`;
}
function head(t){return `<div class="sect"><i></i><h2>${esc(t)}</h2></div>`}

/* ── tabs */
const CATS=['전체','최근',...new Set(PHRASES.map(p=>p.cat))];

function viewPhrases(){
  let html=`<div class="searchbar">
    <input id="q" placeholder="찾기: 화장실, 계산, 아파요, 몇 시…" value="${esc(query)}" oninput="query=this.value;render(true)">
    <div class="chips" id="chips">${CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}" onclick="cat='${c}';render()">${esc(c)}</button>`).join('')}</div>
  </div>`;
  let items;
  if(cat==='최근'){items=recent.map(id=>byId[id]).filter(Boolean)}
  else{items=PHRASES.filter(p=>cat==='전체'||p.cat===cat)}
  if(query.trim()){
    const q=query.trim().toLowerCase();
    items=PHRASES.filter(p=>(p.kr+' '+p.local+' '+(p.roman||'')+' '+p.cat).toLowerCase().includes(q));
  }
  if(!items.length){
    html+=`<div class="empty"><b>${cat==='최근'?'아직 사용한 문장이 없어요':'찾는 문장이 없어요'}</b>${cat==='최근'?'문장을 한 번 열어보면 여기 쌓입니다.':'다른 단어로 찾아보거나 위 분류를 눌러보세요.'}</div>`;
  }else{
    html+=listHTML(items);
  }
  return html;
}

function viewScenes(){
  let html=`<div class="note"><b>순서대로 따라가면 끝납니다</b>상황을 열고 위에서부터 하나씩 보여주세요. 문장을 누르면 화면 가득 커집니다.</div>`;
  SCENES.forEach((s,i)=>{
    const ids=JSON.stringify(s.ids).replace(/"/g,'&quot;');
    html+=`<details class="scene"${i===0?' open':''}>
      <summary><span class="em">${s.icon}</span>${esc(s.title)}<span class="cnt">${s.ids.length}단계</span></summary>
      <div class="steps">${s.ids.map((id,j)=>{const p=byId[id];if(!p)return '';
        return `<button class="step" onclick='openPhrase("${id}",${ids})'>
          <span class="n">${j+1}</span>
          <span><span class="local loc">${esc(p.local)}</span><span class="kr" style="display:block">${esc(p.kr)}</span></span>
        </button>`}).join('')}</div>
    </details>`;
  });
  return html;
}

function viewShow(){
  let html=`<div class="note"><b>입력한 내용을 그대로 크게 보여줍니다</b>주소·호텔명·사람 이름·예약번호·문장·현지어·숫자 등 무엇이든 적을 수 있어요.</div>`;
  html+=head('직접 입력해서 보여주기');
  html+=`<textarea class="big-input" id="pen" inputmode="text" autocomplete="off" autocapitalize="none" placeholder="예: Hilton Tokyo / 18:30 / 王府井大街 / 예약번호 A1234"></textarea>
  <div class="pad">${['1','2','3','4','5','6','7','8','9',':','0','←'].map(k=>`<button type="button" onclick="pad('${k}')">${k}</button>`).join('')}</div>
  <div class="note" style="margin-top:8px"><b>숫자 패드는 선택 사항</b>위 입력칸에는 휴대폰 키보드로 일반 글자도 자유롭게 입력할 수 있습니다.</div>
  <button type="button" class="wide" onclick="showPen(event)">입력한 내용 크게 보여주기</button>`;
  html+=head('상대가 눌러서 답하기');
  CHOICES.forEach((c,i)=>{
    html+=`<div class="q">
      <div class="qhead"><div class="ql loc">${esc(c.localQ)}</div><div class="qk">${esc(c.krQ)}</div></div>
      <div class="opts">${c.answers.map((a,j)=>`<button class="loc" onclick="pick(${i},${j})">${esc(a.local)}</button>`).join('')}</div>
      <div class="ans" id="a${i}"><b></b><span></span></div>
    </div>`;
  });
  return html;
}
function pad(k){
  const el=$('pen');if(!el)return;
  el.value = k==='←' ? el.value.slice(0,-1) : el.value+k;
}
function showPen(e){
  if(e)e.preventDefault();
  const el=$('pen');
  if(!el)return;
  const v=(el.value||'').trim();
  if(!v){
    el.focus();
    return;
  }
  try{el.blur()}catch(_){}
  BST={local:v,kr:'',rom:'',list:[],i:-1,replies:[]};
  $('bLocal').textContent=v;
  $('bKr').textContent='';
  $('bRom').textContent='';
  $('bReply').classList.remove('on');
  $('bRep').innerHTML='';
  $('bRep').style.display='none';
  $('board').classList.remove('sos');
  $('board').classList.add('on');
  document.body.style.overflow='hidden';
}
function pick(i,j){
  const a=CHOICES[i].answers[j],el=$('a'+i);
  el.querySelector('b').textContent=a.kr;
  el.querySelector('span').textContent=a.local;
  el.classList.add('on');
}

function viewFav(){
  const items=PHRASES.filter(p=>favs.has(p.id));
  if(!items.length)return `<div class="empty"><b>즐겨찾기가 비어 있어요</b>문장 오른쪽의 ☆를 누르면 여기에 모입니다.<br>출발 전에 자주 쓸 것만 골라두면 현장에서 훨씬 빨라요.</div>`;
  let html=`<div class="note"><b>${items.length}개 저장됨</b>이 목록은 이 기기에 남아 있어서 비행기 모드에서도 열립니다.</div>`;
  const cats=[...new Set(items.map(p=>p.cat))];
  cats.forEach(c=>{html+=head(c)+listHTML(items.filter(p=>p.cat===c))});
  return html;
}

function viewSos(){
  let html=`<div class="note" style="border-left-color:#d92b2b"><b>누르면 화면 전체가 빨갛게 바뀝니다</b>말이 나오지 않는 상황에서 그대로 상대에게 보여주세요.</div>`;
  html+=head('바로 보여줄 카드');
  SOSCARD.forEach((c,i)=>{
    html+=`<button class="sosbtn" onclick="openBoard(${attr(c.local)},${attr(c.kr)},'',[],-1,true)">
      <span class="local loc">${esc(c.local)}</span><span class="kr">${esc(c.kr)}</span></button>`;
  });
  html+=head('전화 걸기');
  html+=`<div class="sos-grid">${SOSNUM.map(n=>`<a class="tel" href="tel:${n.num.replace(/[^0-9+]/g,'')}">
    <div class="num">${esc(n.num)}</div><div class="lb">${esc(n.label)}</div><div class="ds">${esc(n.desc)}</div></a>`).join('')}</div>`;
  return html;
}

const TABS=[
  ['phrases','💬','문장',viewPhrases],
  ['scenes','🧭','상황',viewScenes],
  ['show','📢','보여주기',viewShow],
  ['favs','★','즐겨찾기',viewFav],
  ['sos','🆘','긴급',viewSos],
];

function render(keepFocus){
  const t=TABS.find(x=>x[0]===tab);
  $('main').innerHTML=t[3]();
  $('nav').innerHTML=TABS.map(x=>`<button aria-selected="${x[0]===tab}" onclick="setTab('${x[0]}')"><span class="ic">${x[1]}</span>${x[2]}</button>`).join('');
  if(keepFocus&&$('q')){const el=$('q');el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  const ch=$('chips');
  if(ch){const on=ch.querySelector('[aria-pressed="true"]');if(on&&!keepFocus&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'})}
}
function setTab(t){tab=t;query='';try{scrollTo(0,0)}catch(e){}render()}

matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(cfg.theme==='auto')applyCfg()});
applyCfg();render();
</script></body></html>
